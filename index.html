<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />

  <title>QuickBoard</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div id="bg-overlay"></div>
  
  <div id="help-btn" title="Keyboard Shortcuts (H)">?</div>
  
  <div id="settings-btn" title="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
  </div>

  <div id="settings-modal">
    <div class="settings-content">
      <div class="settings-header">
        <h2>Settings</h2>
        <span id="close-settings" class="close-btn">&times;</span>
      </div>
      <div class="settings-body">
        <div class="settings-group">
          <h3>Search</h3>
          <div class="input-row">
            <label>Search Engine</label>
            <select id="set-search-engine">
              <option value="https://www.google.com/search?q=">Google</option>
              <option value="https://duckduckgo.com/?q=">DuckDuckGo</option>
              <option value="https://www.bing.com/search?q=">Bing</option>
              <option value="https://searx.tiekoetter.com/search?q=">Searx</option>
            </select>
          </div>
        </div>

        <div class="settings-group">
          <h3>Weather</h3>
          <div class="input-row">
            <label>City</label>
            <input type="text" id="set-city" placeholder="Istanbul">
          </div>
          <div class="input-row">
            <label>API Key</label>
            <input type="password" id="set-api-key" placeholder="OpenWeather Key">
          </div>
          <div class="input-row">
            <label>Units</label>
            <select id="set-units">
              <option value="metric">Metric (°C)</option>
              <option value="imperial">Imperial (°F)</option>
            </select>
          </div>
        </div>

        <div class="settings-group">
          <h3>Interface</h3>
          <div class="input-row">
            <label>Accent Color</label>
            <input type="color" id="set-accent-color">
          </div>
          <div class="input-row">
            <label>Hour Format</label>
            <select id="set-hour-format">
              <option value="24">24 Hour</option>
              <option value="12">12 Hour</option>
            </select>
          </div>
          <div class="toggle-row">
            <label>Dynamic Background</label>
            <input type="checkbox" id="set-show-bg">
          </div>
          <div class="toggle-row">
            <label>Show Quotes</label>
            <input type="checkbox" id="set-show-quotes">
          </div>
        </div>

        <div class="settings-group">
          <button id="save-settings" class="btn-primary">Apply & Save</button>
        </div>
      </div>
    </div>
  </div>

  <div id="help-modal" class="modal">
    <div class="settings-content">
      <div class="settings-header">
        <h2>Keyboard Shortcuts</h2>
        <span id="close-help" class="close-btn">&times;</span>
      </div>
      <div class="settings-body">
        <div class="shortcut-list">
          <div class="shortcut-item"><kbd>Space</kbd> <span>Open Search</span></div>
          <div class="shortcut-item"><kbd>Esc</kbd> <span>Close Modals / Clear Search</span></div>
          <div class="shortcut-item"><kbd>H</kbd> <span>Toggle this help menu</span></div>
          <div class="shortcut-item"><kbd>S</kbd> <span>Open Settings</span></div>
        </div>
      </div>
    </div>
  </div>


  <div id="search">
    <input id="search-field" type="text" name="search-field" placeholder="Search here..." aria-label="Search" />
  </div>

  <div class="container">
    <div id="clock">
      <div id="date"></div>
      <div id="time"></div>
    </div>
    <div id="progress-container" title="Day Progress">
      <div id="progress-bar"></div>
      <span id="progress-text"></span>
    </div>
    <div id="weather-container">
      <div class="row">
        <span id="weather-description"></span>
        <span class="separator">-</span>
        <span id="temp"></span>
      </div>
    </div>
    <div id="quote-container">
      <p id="quote-text"></p>
      <span id="quote-author"></span>
    </div>
    <div id="bookmark-container"></div>
  </div>



  <script src="bookmarks.js"></script>
  <script src="script.js"></script>
</body>

</html>
